<!doctype html>
<html><head><meta charset='utf-8'><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;pointer-events:none}
#tablet{container-type:inline-size;position:absolute;right:__RIGHT__px;top:__TOP__px;width:min(__WIDTH__px,calc(100vw - 16px));height:min(__HEIGHT__px,calc(100vh - __TOP__px - 8px));min-height:140px;padding:21px 16px 24px;background:linear-gradient(90deg,#080b0c,#333b3e 3%,#161c1e 6%,#101517 94%,#343c3f 97%,#080b0c);border:2px solid #050708;border-radius:3px;box-shadow:inset 0 0 0 1px #59616466,inset 0 0 0 5px #090d0f,0 4px 10px #000b;color:#a5adae;font:7px Arial,sans-serif}
.screen{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);background:#101619;border:1px solid #050708;box-shadow:0 0 0 3px #050708}
iframe{border:0;width:100%;flex:1;min-height:0;display:block}footer{flex:0 0 16px;text-align:center;padding:3px 0;background:#101619;color:#bdc5c7;font:8px Arial,sans-serif;white-space:nowrap}
.rail{position:absolute;z-index:2;border:1px solid #080b0c;border-radius:1px;box-shadow:inset 0 1px 1px #dce1db21,inset 0 -2px 4px #000e,0 0 0 1px #000b}
.rail.side{top:25px;bottom:27px;width:7px;background:linear-gradient(90deg,#080b0c,#252c2e 18%,#555d5f 28%,#22282a 39%,#101416 48%,#303638 62%,#161b1d 78%,#080b0c)}
.rail.left{left:4px}.rail.right{right:4px}.rail.horizontal{left:25px;right:25px;height:7px;background:linear-gradient(180deg,#080b0c,#242b2d 18%,#555d5f 29%,#22282a 41%,#101416 53%,#303638 67%,#161b1d 82%,#080b0c)}.rail.top{top:6px}.rail.bottom{bottom:6px}
.rail.side:after{content:'';position:absolute;inset:6px 2px;background:repeating-linear-gradient(180deg,transparent 0 10px,#000b 10px 11px,#969d9b29 11px 12px)}.rail.horizontal:after{content:'';position:absolute;inset:2px 8px;background:repeating-linear-gradient(90deg,transparent 0 19px,#000b 19px 20px,#969d9b29 20px 21px)}
.guard{position:absolute;z-index:4;width:30px;height:30px;border:1px solid #050708;background:radial-gradient(ellipse at 24% 13%,#bfc6bf1c,transparent 29%),linear-gradient(142deg,#1c2122,#101415 28%,#090c0d 66%,#050708);box-shadow:inset 0 1px 0 #ebeee429,inset 0 0 0 1px #000c,inset -2px -3px 4px #000,0 2px 3px #000}
.guard:before{content:'';position:absolute;inset:3px;border:1px solid #5b646577;border-radius:2px;box-shadow:inset 0 1px 2px #000,0 0 0 1px #000c}
.tl{top:-2px;left:-2px;clip-path:polygon(0 0,100% 0,100% 58%,58% 100%,0 100%)}.tr{top:-2px;right:-2px;clip-path:polygon(0 0,100% 0,100% 100%,42% 100%,0 58%)}.bl{bottom:-2px;left:-2px;clip-path:polygon(0 0,58% 0,100% 42%,100% 100%,0 100%)}.br{bottom:-2px;right:-2px;clip-path:polygon(42% 0,100% 0,100% 100%,0 100%,0 42%)}
.screw{position:absolute;width:7px;height:7px;top:6px;left:6px;border:1px solid #070a0b;border-radius:50%;background:radial-gradient(circle at 35% 30%,#737b7d,#343b3e 35%,#0a0e10 65%);box-shadow:0 1px 1px #000,inset 0 1px 1px #fff2}.screw:after{content:'';position:absolute;top:2px;left:1px;width:3px;height:1px;background:#000;transform:rotate(-32deg)}.tr .screw,.br .screw{left:auto;right:6px}.bl .screw,.br .screw{top:auto;bottom:6px}
.plate{position:absolute;z-index:3;top:3px;left:50%;transform:translateX(-50%);padding:4px 12px;border:1px solid #090c0d;border-radius:1px;background:linear-gradient(#343b3d,#202628 42%,#111618);box-shadow:inset 0 1px 0 #e6e9e624,inset 0 -2px 3px #000,0 2px 3px #000;color:#c99742b8;font:700 5px Arial,sans-serif;letter-spacing:1.2px;white-space:nowrap}
.link{position:absolute;z-index:3;top:6px;right:35px;height:9px;display:flex;gap:3px;align-items:center;padding:1px 4px;border:1px solid #090c0d;border-radius:1px;background:linear-gradient(#080b0c,#1a2022,#090c0d);font:700 4px Arial,sans-serif;letter-spacing:.6px;color:#82918a}.led{width:3px;height:3px;border-radius:50%;background:#6da775;box-shadow:0 0 3px #6da775b3}.wifi{width:8px;height:7px;stroke:#75a97c;fill:none;stroke-width:1.5}
.controls{position:absolute;z-index:3;bottom:4px;left:38px;right:38px;display:flex;align-items:center;justify-content:space-between;gap:4px;height:11px;font:700 4px Arial;letter-spacing:.4px;color:#929b9e}.bank{display:flex;align-items:center;gap:3px;padding:2px 4px;border:1px solid #070a0b;background:linear-gradient(#343d40,#111719);box-shadow:inset 0 1px 0 #fff2}.key{padding:1px 2px;background:linear-gradient(#5b6568,#252d30);border:1px solid #0b1012;color:#aeb8ba;border-radius:1px}.active{color:#e0a43b}.power{width:10px;height:10px;border:1px solid #b78a38;border-radius:50%;display:flex;align-items:center;justify-content:center;font:8px Arial;color:#d4a94f;box-shadow:inset 0 1px 1px #fff3;background:#20282b}
@container(max-width:280px){.link{right:30px;font-size:3.5px;gap:2px}.plate{left:40%;font-size:4px;letter-spacing:.7px;padding:4px 8px}.controls{left:32px;right:32px}.controls>.bank:nth-child(2){display:none}}
</style></head><body>
<section id='tablet' aria-label='TSD tablet minimap'>
 <span class='rail side left'></span><span class='rail side right'></span><span class='rail horizontal top'></span><span class='rail horizontal bottom'></span>
 <div class='guard tl'><i class='screw'></i></div><div class='guard tr'><i class='screw'></i></div><div class='guard bl'><i class='screw'></i></div><div class='guard br'><i class='screw'></i></div>
 <div class='plate'>TSD // FIELD TERMINAL</div><div class='link'><i class='led'></i>TSD LINK<svg class='wifi' viewBox='0 0 20 18'><path d='M2 6 Q10 -1 18 6 M5 9 Q10 4 15 9 M8 12 Q10 10 12 12'/><circle cx='10' cy='15' r='1'/></svg></div>
 <div class='screen'><iframe title='Satellite minimap' src='__URL__?tsdMini=1'></iframe><footer>Satellite by Fums · CC BY-NC 4.0</footer></div>
 <div class='controls' aria-hidden='true'><span class='bank'>MODE <i class='key active'>MAP</i><i class='key'>LOG</i></span><span class='bank'>TSD // MAP LINK</span><span class='power'>⏻</span></div>
</section></body></html>
